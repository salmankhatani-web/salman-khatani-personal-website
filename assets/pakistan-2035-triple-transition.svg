<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Pakistan 2035: Digital–Green–Epistemic Triple Transition</title>
  <desc id="desc">Three overlapping circles labelled Digital, Green and Epistemic converge around Pakistan 2035 and Human Agency.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071823"/><stop offset="1" stop-color="#102f35"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#f1c66d" stop-opacity=".42"/><stop offset="1" stop-color="#f1c66d" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>
  <circle cx="800" cy="470" r="260" fill="url(#glow)"/>
  <text x="100" y="105" fill="#f4f1e9" font-family="Georgia,serif" font-size="54" font-weight="700">Pakistan 2035</text>
  <text x="100" y="155" fill="#aebfc1" font-family="Arial,sans-serif" font-size="25">The Digital–Green–Epistemic Triple Transition</text>
  <line x1="100" y1="185" x2="1500" y2="185" stroke="#49616a"/>

  <circle cx="625" cy="400" r="250" fill="#0c5681" fill-opacity=".78" stroke="#75c7e8" stroke-width="3"/>
  <circle cx="975" cy="400" r="250" fill="#296128" fill-opacity=".78" stroke="#9bc76b" stroke-width="3"/>
  <circle cx="800" cy="620" r="250" fill="#8a501e" fill-opacity=".78" stroke="#e0ae69" stroke-width="3"/>

  <text x="515" y="300" fill="#fff" font-family="Arial,sans-serif" font-size="42" font-weight="700">DIGITAL</text>
  <text x="505" y="342" fill="#e8f4f8" font-family="Arial,sans-serif" font-size="22">AI · Work · Platforms</text>
  <text x="495" y="385" fill="#d5e8ef" font-family="Arial,sans-serif" font-size="19">Augmentation</text>
  <text x="495" y="418" fill="#d5e8ef" font-family="Arial,sans-serif" font-size="19">Digital entrepreneurship</text>
  <text x="495" y="451" fill="#d5e8ef" font-family="Arial,sans-serif" font-size="19">Access and capability</text>

  <text x="910" y="300" fill="#fff" font-family="Arial,sans-serif" font-size="42" font-weight="700">GREEN</text>
  <text x="880" y="342" fill="#edf6e5" font-family="Arial,sans-serif" font-size="22">Climate · Energy · Resilience</text>
  <text x="910" y="385" fill="#dbead3" font-family="Arial,sans-serif" font-size="19">Green jobs</text>
  <text x="910" y="418" fill="#dbead3" font-family="Arial,sans-serif" font-size="19">Adaptation</text>
  <text x="910" y="451" fill="#dbead3" font-family="Arial,sans-serif" font-size="19">Local value creation</text>

  <text x="675" y="674" fill="#fff" font-family="Arial,sans-serif" font-size="42" font-weight="700">EPISTEMIC</text>
  <text x="665" y="716" fill="#fbefe2" font-family="Arial,sans-serif" font-size="22">Knowledge · Language · Agency</text>
  <text x="690" y="757" fill="#f5dfc8" font-family="Arial,sans-serif" font-size="19">Knowledge pluralism · representation</text>
  <text x="706" y="790" fill="#f5dfc8" font-family="Arial,sans-serif" font-size="19">Participation in shaping futures</text>

  <circle cx="800" cy="475" r="126" fill="#f5f0e5" stroke="#f1c66d" stroke-width="5"/>
  <text x="800" y="438" fill="#0b2830" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="700">PAKISTAN</text>
  <text x="800" y="481" fill="#0b2830" text-anchor="middle" font-family="Arial,sans-serif" font-size="46" font-weight="800">2035</text>
  <text x="800" y="528" fill="#74521a" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700">HUMAN AGENCY</text>

  <text x="100" y="850" fill="#c6d1d1" font-family="Arial,sans-serif" font-size="22">Different starting conditions require different transition questions.</text>
  <text x="1500" y="850" fill="#f1c66d" text-anchor="end" font-family="Arial,sans-serif" font-size="20">Dr. Salman Ahmed Khatani</text>
</svg>